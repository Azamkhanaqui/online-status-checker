<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Status checker</title>
  <style>
    :root { --glow: #9aa3bd; --screen: linear-gradient(160deg, #4a5064, #2c3042); }
    body.online  { --glow: #3ee0a8; --screen: linear-gradient(160deg, #1f9d78, #0f5f55); }
    body.offline { --glow: #ff7b7b; --screen: linear-gradient(160deg, #b23a44, #5a1f2e); }

    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(ellipse at 50% 30%, #2c3366, #1c2140 70%);
      font-family: "Segoe UI", system-ui, sans-serif; color: #fff;
    }
    .stage { perspective: 1100px; padding: 40px 0; }

    .phone {
      position: relative; width: min(240px, 62vw); aspect-ratio: 1 / 2;
      border: 9px solid #3b4258; border-radius: 40px; background: #232838;
      transform: rotateY(-20deg) rotateX(6deg);
      box-shadow: 8px 0 0 #2d3347, 16px 0 0 #242839, 28px 36px 60px rgba(0, 0, 0, .45);
      animation: float 6s ease-in-out infinite;
      transition: box-shadow .8s;
    }
    .phone::before {
      content: ""; position: absolute; right: -14px; top: 22%; width: 5px; height: 15%;
      border-radius: 3px; background: #3b4258;
    }
    .notch {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 62px; height: 18px; border-radius: 12px; background: #12151f; z-index: 3;
    }
    .screen {
      position: absolute; inset: 0; border-radius: 30px; background: var(--screen);
      overflow: hidden; transition: background .6s;
    }

    /* map: wide and blurred when offline, zoomed right in when online */
    .zoomer {
      position: absolute; inset: 0; transform-origin: 50% 41.1%;
      transform: scale(.42); filter: blur(2px); opacity: .5;
      transition: transform 3s cubic-bezier(.2, .7, .2, 1), filter 3s ease,
      opacity 1.2s ease;
    }
    body.online .zoomer { transform: scale(2.2); filter: blur(0px); opacity: 1; }
    body.down .zoomer   { opacity: .35; }

    .map {
      position: absolute; left: -20px; top: -20px; overflow: visible;
      width: calc(100% + 40px); height: calc(100% + 40px);
    }

    /* overview fades out as the close-up fades in */
    #overview { transition: opacity 2.4s ease; }
    body.online #overview { opacity: .12; }

    /* mid-zoom street grid: appears while zooming, gone once close */
    #grid { opacity: 0; }
    body.online #grid { animation: gridpass 3s ease forwards; }

    /* close-up: wide roads and buildings */
    #detail { opacity: 0; transition: opacity .8s ease; }
    body.online #detail { opacity: 1; transition: opacity 1.6s ease 1s; }

    /* darker lower area keeps the text readable over the map */
    .fade {
      position: absolute; left: 0; right: 0; bottom: 0; height: 52%;
      background: linear-gradient(to bottom, transparent, rgba(0, 0, 0, .42) 45%);
    }

    .halo {
      position: absolute; left: 50%; top: 41.1%; width: 76px; height: 76px; margin: -38px 0 0 -38px;
      border-radius: 50%; background: var(--glow); opacity: .18; transition: opacity .6s;
    }
    body.online .halo { animation: halo 1.6s ease-in-out infinite; }
    body.offline .halo, body.down .halo { opacity: .08; }

    .dot {
      position: absolute; left: 50%; top: 41.1%; width: 20px; height: 20px; margin: -10px 0 0 -10px;
      border-radius: 50%; background: var(--glow); border: 3px solid rgba(255, 255, 255, .95);
      box-shadow: 0 0 6px 0 var(--glow); transition: opacity .6s;
    }
    body.offline .dot { opacity: .6; }
    body.down .dot    { opacity: .45; }
    /* online: lub-dub heartbeat. offline or down: the dot stays still */
    body.online .dot { animation: heartbeat 1.6s ease-in-out infinite; }

    .info { position: absolute; left: 0; right: 0; top: 63%; padding: 0 12px; text-align: center; }
    h1 { margin: 0 0 8px; font-size: 2rem; font-weight: 700; letter-spacing: -.01em; }
    p  { margin: 0; font-size: .85rem; opacity: .9; }
    .caption { margin-top: 36px; text-align: center; font-size: .9rem; opacity: .7; }

    /* online: the phone stays straight and faces you */
    body.online .phone {
      transform: rotateY(0deg) rotateX(0deg);
      box-shadow: 0 36px 60px rgba(0, 0, 0, .45);
      animation: floatFront 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: rotateY(-20deg) rotateX(6deg) translateY(0); }
      50%      { transform: rotateY(-14deg) rotateX(4deg) translateY(-10px); }
    }
    @keyframes floatFront {
      0%, 100% { transform: rotateY(0deg) rotateX(0deg) translateY(0); }
      50%      { transform: rotateY(0deg) rotateX(0deg) translateY(-10px); }
    }
    @keyframes heartbeat {
      0%   { transform: scale(1);    box-shadow: 0 0 6px 0 var(--glow); }
      14%  { transform: scale(1.3);  box-shadow: 0 0 18px 4px var(--glow); }
      28%  { transform: scale(1);    box-shadow: 0 0 6px 0 var(--glow); }
      42%  { transform: scale(1.18); box-shadow: 0 0 14px 3px var(--glow); }
      56%  { transform: scale(1);    box-shadow: 0 0 6px 0 var(--glow); }
      100% { transform: scale(1);    box-shadow: 0 0 6px 0 var(--glow); }
    }
    @keyframes halo {
      0%   { transform: scale(1);    opacity: .18; }
      14%  { transform: scale(1.5);  opacity: .32; }
      28%  { transform: scale(1);    opacity: .18; }
      42%  { transform: scale(1.3);  opacity: .26; }
      56%  { transform: scale(1);    opacity: .18; }
      100% { transform: scale(1);    opacity: .18; }
    }
    @keyframes gridpass {
      0%   { opacity: 0; }
      40%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* coming online: tilt, then straighten and rise, then settle facing you */
    body .phone.wake { animation: wake 1.4s cubic-bezier(.25, .8, .3, 1) 1; }
    @keyframes wake {
      0%   { transform: rotateY(-20deg) rotateX(6deg) translateY(0) scale(1); }
      40%  { transform: rotateY(0deg) rotateX(0deg) translateY(-22px) scale(1.06); }
      100% { transform: rotateY(0deg) rotateX(0deg) translateY(0) scale(1); }
    }

    /* going offline: ease back into the tilt */
    body .phone.sleep { animation: sleep .8s ease-in-out 1; }
    @keyframes sleep {
      0%   { transform: rotateY(0deg) rotateX(0deg); }
      100% { transform: rotateY(-20deg) rotateX(6deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .phone, body.online .phone, body .phone.wake, body .phone.sleep { animation: none; }
      body.online .dot, body.online .halo, body.online #grid { animation: none; }
      .zoomer, #overview, #detail { transition: none; }
    }
  </style>
</head>
<body class="down">
<main class="stage">
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="zoomer">
        <svg class="map" viewBox="0 0 262 502" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

          <g id="overview">
            <g fill="#fff" fill-opacity=".07">
              <rect x="170" y="250" width="60" height="44" rx="10"/>
              <circle cx="60" cy="110" r="26"/>
              <rect x="30" y="330" width="70" height="50" rx="12"/>
              <rect x="-90" y="100" width="55" height="42" rx="10"/>
              <rect x="300" y="420" width="70" height="50" rx="12"/>
              <rect x="10" y="570" width="60" height="60" rx="12"/>
              <rect x="190" y="660" width="80" height="50" rx="12"/>
              <rect x="-70" y="450" width="55" height="55" rx="12"/>
              <circle cx="240" cy="30" r="22"/>
              <circle cx="210" cy="570" r="30"/>
              <circle cx="-30" cy="640" r="34"/>
              <circle cx="330" cy="150" r="28"/>
            </g>
            <path d="M-600 380 L-10 350 C 60 320, 110 400, 280 350 L 900 320" fill="none" stroke="#fff"
                  stroke-opacity=".10" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
            <g fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="3" stroke-linecap="round"
               stroke-linejoin="round">
              <path d="M-500 -287 L800 731"/>
              <path d="M-137 -700 L406 1200"/>
              <path d="M-600 240 L-10 214 C 90 190, 170 236, 272 204 L 900 180"/>
            </g>
          </g>

          <g id="grid" stroke="#fff" stroke-opacity=".09" stroke-width="1.2"
             transform="rotate(-14 131 251)"></g>

          <g id="detail" transform="translate(131 210) rotate(-14)">
            <path fill="#fff" fill-opacity=".2"
                  d="M-320 -7H320V7H-320Z M18 -320H30V320H18Z M-320 -62H320V-52H-320Z M-320 56H320V66H-320Z M-44 -320H-34V320H-44Z"/>
            <g fill="#000" fill-opacity=".17" stroke="#fff" stroke-opacity=".28" stroke-width=".5">
              <rect x="-110" y="-120" width="62" height="54" rx="3"/>
              <rect x="-30"  y="-120" width="44" height="54" rx="3"/>
              <rect x="34"   y="-120" width="86" height="54" rx="3"/>
              <rect x="-110" y="-48"  width="62" height="37" rx="3"/>
              <rect x="-30"  y="-48"  width="44" height="37" rx="3"/>
              <rect x="34"   y="-48"  width="86" height="37" rx="3"/>
              <rect x="-110" y="11"   width="62" height="41" rx="3"/>
              <rect x="-30"  y="11"   width="44" height="41" rx="3"/>
              <rect x="34"   y="11"   width="86" height="41" rx="3"/>
              <rect x="-110" y="70"   width="62" height="60" rx="3"/>
              <rect x="-30"  y="70"   width="44" height="60" rx="3"/>
              <rect x="34"   y="70"   width="86" height="60" rx="3"/>
            </g>
            <path d="M-320 0H320M24 -320V320" fill="none" stroke="#fff" stroke-opacity=".55"
                  stroke-width=".7" stroke-dasharray="5 4"/>
          </g>

        </svg>
      </div>
      <div class="fade"></div>
      <div class="halo"></div>
      <div class="dot"></div>
      <div class="info">
        <h1 id="state" aria-live="polite">Checking</h1>
        <p id="note">Waiting for the server</p>
      </div>
    </div>
  </div>
  <div class="caption">My phone</div>
</main>

<script>
  const text = {
    online:  ["Online",      "Heartbeat received"],
    offline: ["Offline",     "No heartbeat"],
    down:    ["Server down"]
  };

  // draw the tilted street grid (extra wide so the zoomed-out view is filled)
  let lines = "";
  for (let y = -700; y <= 1200; y += 44) lines += `<line x1="-700" y1="${y}" x2="960" y2="${y}"/>`;
  for (let x = -700; x <= 960; x += 52) lines += `<line x1="${x}" y1="-700" x2="${x}" y2="1200"/>`;
  document.getElementById("grid").innerHTML = lines;

  const phone = document.querySelector(".phone");
  phone.addEventListener("animationend", (e) => {
    if (e.animationName === "wake") phone.classList.remove("wake");
    if (e.animationName === "sleep") phone.classList.remove("sleep");
  });
  let previous = null;

  function play(name) {
    phone.classList.remove("wake", "sleep");
    void phone.offsetWidth; // restart the animation
    phone.classList.add(name);
  }

  async function check() {
    let key = "down";
    try {
      const r = await fetch("/status", { cache: "no-store" });
      key = (await r.text()).trim() === "online" ? "online" : "offline";
    } catch (e) {}

    if (key === "online" && previous !== "online") play("wake");
    else if (key !== "online" && previous === "online") play("sleep");

    previous = key;
    document.body.className = key;
    document.getElementById("state").textContent = text[key][0];
    document.getElementById("note").textContent = text[key][1];
    document.title = text[key][0] + " - Status checker";
  }
  check();
  setInterval(check, 2000);
</script>
</body>
</html>
